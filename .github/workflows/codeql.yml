name: "CodeQL Advanced"

# Job names, step names, and matrix shape follow GitHub's canonical
# "CodeQL Advanced" Code Scanning template exactly. The Code Scanning UI
# registers configurations keyed off `(workflow_path, job_id, category)`
# tuples and shows status using template-default identifiers; deviating
# from those names produces orphan configuration cards in the UI that
# can't be cleaned up via API (PR-merge analyses are non-deletable).
#
# Three matrix entries cover the languages CodeQL detects in this repo:
#   - actions             (source-only)
#   - java-kotlin         (manual build via compileAndroidMain — see note)
#   - javascript-typescript (source-only)
#
# For java-kotlin, the matrix-shared `Initialize CodeQL -> Perform CodeQL
# Analysis` flow is augmented with two conditional steps that run ONLY
# for that language:
#
#   1. JDK + Gradle setup (the other two languages need no toolchain).
#   2. A `./gradlew setupAndroidSdk compileAndroidMain compileKotlinJs
#      compileKotlinWasmJs` invocation under the CodeQL build tracer.
#
# This is a strict-KMP project where autobuild's JVM-style default has no
# useful task to run, and `build-mode: none` extracts nothing for Java/Kotlin.
# The `com.android.kotlin.multiplatform.library` plugin runs the JVM `kotlinc`
# for the android target and emits real `.class` files under
# `build/classes/kotlin/android/main`, which is exactly what the extractor's
# LD_PRELOAD tracer installed by `Initialize CodeQL` can hook.
# `compileAndroidMain` therefore carries the java-kotlin analysis;
# `compileKotlinJs`/`compileKotlinWasmJs` are added on the chance the tracer
# also matches the JS/WASM `kotlinc` execs. `--rerun-tasks --no-build-cache`
# defeats Gradle's up-to-date checks so kotlinc actually runs, and
# `-Pkotlin.compiler.execution.strategy=out-of-process` plus
# `--no-configuration-cache --no-daemon` force fresh traceable compiler execs.
# That is why this file uses `build-mode: manual` for java-kotlin even though
# autobuild is the template default.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for SARIF upload
      security-events: write
      # required by codeql-action/analyze@v4 in private repos
      actions: read
      # required to fetch internal or private CodeQL packs from GHCR
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # JDK + Gradle setup only for java-kotlin; the source-only languages
      # don't run any build at all.
      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6.1.0

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Restores+stores the CodeQL bundle and dependency cache between
          # runs. Default off in Advanced Setup; turning on cuts ~30-60s
          # off the init step on warm cache.
          dependency-caching: true

      # Manual build: only java-kotlin gates this. `Initialize CodeQL` above
      # installs the LD_PRELOAD build tracer into the environment; this Gradle
      # invocation runs the android and JS/WASM Kotlin compilers as fresh
      # out-of-process execs that the tracer can intercept, writing extractor
      # output under ${CODEQL_EXTRACTOR_JAVA_TRAP_DIR}.
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        run: |
          ./gradlew \
            setupAndroidSdk \
            compileAndroidMain \
            compileKotlinJs \
            compileKotlinWasmJs \
            --rerun-tasks \
            --no-build-cache \
            -Pkotlin.compiler.execution.strategy=out-of-process \
            --no-configuration-cache \
            --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
